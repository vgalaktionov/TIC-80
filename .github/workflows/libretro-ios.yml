name: iOS libretro

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target:
          - {sdk: iphoneos, arch: arm64}
          - {sdk: iphonesimulator, arch: arm64}
          - {sdk: iphonesimulator, arch: x86_64}
        static: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build all runtimes and verify frontend linking
        env:
          SDK: ${{ matrix.target.sdk }}
          ARCH: ${{ matrix.target.arch }}
          LIBRETRO_STATIC: ${{ matrix.static }}
        run: bash tools/libretro/build-ios.sh
      - uses: actions/upload-artifact@v6
        with:
          name: libretro-${{ matrix.target.sdk }}-${{ matrix.target.arch }}-static-${{ matrix.static }}
          path: |
            build/libretro-*/bin/tic80_libretro.dylib
            build/libretro-*/lib/tic80_libretro.a
